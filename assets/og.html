<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Til Sunrise — imagen para compartir (fuente de og.png)</title>
<!--
  Esta es la plantilla de la imagen que se ve cuando alguien comparte el enlace
  del menú por WhatsApp, Instagram o Facebook.

  Para regenerarla: abre este archivo servido por HTTP (no con file://, las
  fuentes no cargan), toma una captura del recuadro de 1200x630 y guárdala
  como assets/og.png.
-->
<style>
  @font-face {
    font-family: 'Montserrat';
    font-style: normal;
    font-weight: 400 800;
    src: url('fonts/montserrat-latin.woff2') format('woff2');
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #d9d4ca;
    font-family: 'Montserrat', system-ui, sans-serif;
  }

  .og {
    position: relative;
    width: 1200px;
    height: 630px;
    overflow: hidden;
    background: #fff9ef;
    display: grid;
    grid-template-columns: 1fr 470px;
    align-items: center;
  }

  .og__leaf { position: absolute; }
  .og__leaf--tl { top: -118px; left: -128px; width: 215px; transform: rotate(-9deg); }
  .og__leaf--br { bottom: -104px; left: 44px; width: 165px; transform: rotate(150deg); opacity: 0.35; }

  .og__text {
    position: relative;
    z-index: 2;
    padding: 0 0 0 84px;
  }

  .og__logo { width: 210px; height: auto; display: block; margin-bottom: 22px; }

  .og__title {
    margin: 0;
    color: #123a59;
    font-size: 132px;
    font-weight: 800;
    line-height: 0.9;
    letter-spacing: -0.01em;
    text-transform: uppercase;
  }

  .og__sub {
    display: block;
    margin-top: 20px;
    color: #123a59;
    font-size: 22px;
    font-weight: 600;
    letter-spacing: 0.4em;
    text-transform: uppercase;
  }

  .og__rule {
    display: flex;
    align-items: center;
    gap: 14px;
    width: 330px;
    margin: 30px 0 22px;
    color: #f6cc4b;
  }
  .og__rule::before, .og__rule::after {
    content: '';
    flex: 1;
    height: 4px;
    background: currentColor;
    border-radius: 4px;
  }
  .og__rule span { font-size: 18px; line-height: 1; }

  .og__tag {
    margin: 0;
    max-width: 430px;
    color: #45543f;
    font-size: 23px;
    font-weight: 500;
    line-height: 1.45;
  }

  /* la escena: el gato y la taza delante del sol naciente */
  .og__scene {
    position: relative;
    width: 470px;
    height: 630px;
  }
  .og__art {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 322px;
    transform: translate(-50%, -50%);
  }
</style>
</head>
<body>
  <div class="og">
    <img class="og__leaf og__leaf--tl" src="leaf-navy.png" alt="">
    <img class="og__leaf og__leaf--br" src="leaf-gold.png" alt="">

    <div class="og__text">
      <img class="og__logo" src="logo.png" alt="">
      <h1 class="og__title">Menú<span class="og__sub">Cali, Colombia</span></h1>
      <p class="og__rule"><span>&#10022;</span></p>
      <p class="og__tag">Café de especialidad hecho con pasión en Cali para despertar tus mejores días</p>
    </div>

    <div class="og__scene">
      <img class="og__art" src="cat-and-cup.png" alt="">
    </div>
  </div>
</body>
</html>
